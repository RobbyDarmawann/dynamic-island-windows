<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e2a"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a6b"/>
      <stop offset="0.55" stop-color="#2c3550"/>
      <stop offset="1" stop-color="#333c5c"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fc3c44"/>
      <stop offset="1" stop-color="#7d5cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b7a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- island pill menempel tepi atas -->
  <path d="M390 0 h500 v92 a30 30 0 0 1 -30 30 h-440 a30 30 0 0 1 -30 -30 z" fill="url(#pill)" stroke="rgba(255,255,255,0.14)"/>
  <!-- cover -->
  <rect x="416" y="18" width="86" height="86" rx="16" fill="url(#art)"/>
  <path d="M452 82 V44 l26 -5 v36" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="443" cy="82" r="7.5" fill="rgba(255,255,255,0.92)"/>
  <circle cx="469" cy="75" r="7.5" fill="rgba(255,255,255,0.92)"/>
  <!-- judul + artis -->
  <rect x="522" y="30" width="215" height="19" rx="9.5" fill="rgba(255,255,255,0.92)"/>
  <rect x="522" y="58" width="140" height="13" rx="6.5" fill="rgba(255,255,255,0.45)"/>
  <!-- progres -->
  <rect x="522" y="86" width="230" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>
  <rect x="522" y="86" width="96" height="6" rx="3" fill="#fc3c44"/>
  <!-- kontrol -->
  <path d="M782 44 h5 v34 h-5 z M806 48 v26 c0 3 -3.4 4.6 -5.8 3 l-12 -9.4 a3.4 3.4 0 0 1 0 -5.2 l12 -9.4 c2.4 -1.6 5.8 0 5.8 3 z" fill="#ffffff"/>
  <path d="M836 46 l24 15 -24 15 z" fill="#ffffff"/>
  <path d="M884 44 h5 v34 h-5 z M862 48 v26 c0 3 3.4 4.6 5.8 3 l12 -9.4 a3.4 3.4 0 0 0 0 -5.2 l-12 -9.4 c-2.4 -1.6 -5.8 0 -5.8 3 z" fill="#ffffff" transform="translate(-6 0)"/>
  <!-- teks -->
  <text x="640" y="212" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="57" font-weight="700" fill="url(#title)">Dynamic Island for Windows</text>
  <text x="640" y="262" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" fill="rgba(235,238,255,0.72)">YouTube Music + lirik tersinkron + chat Gemini, hidup di tepi atas layarmu</text>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="rgba(235,238,255,0.88)">
    <rect x="352" y="298" width="168" height="38" rx="19" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.13)"/>
    <text x="436" y="323" text-anchor="middle">Electron 45</text>
    <rect x="538" y="298" width="204" height="38" rx="19" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.13)"/>
    <text x="640" y="323" text-anchor="middle">Windows 11</text>
    <rect x="760" y="298" width="168" height="38" rx="19" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.13)"/>
    <text x="844" y="323" text-anchor="middle">MIT License</text>
  </g>
</svg>
